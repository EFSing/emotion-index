[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion-index"
version = "0.1.0"
description = "Social media stock market sentiment monitoring and emotion index system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
emotion-index = "emotion_index.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["emotion_index*"]
